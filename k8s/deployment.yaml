apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlops-serve
  namespace: mlops
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mlops-serve
  template:
    metadata:
      labels:
        app: mlops-serve
    spec:
      containers:
        - name: mlops-serve
          image: ghcr.io/your-org/mlops-pipeline:serve-latest
          ports:
            - containerPort: 8000
          env:
            - name: CONFIG_PATH
              value: configs/config.yaml
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15